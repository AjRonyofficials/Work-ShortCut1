name: Build Work ShortCut APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment Files
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          touch .env

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -f debug.keystore
          echo "debug.keystore is ready ($(wc -c < debug.keystore) bytes)"

      - name: Ensure Gradle Wrapper and Executable Permissions
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in repository root. Auto-generating Gradle wrapper with Gradle 9.3.1..."
            gradle wrapper --gradle-version 9.3.1 || gradle wrapper || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "gradlew found and marked executable."
          else
            echo "gradlew not present, will fallback directly to system gradle."
          fi

      - name: Build Debug APK
        run: |
          if [ -x "./gradlew" ]; then
            echo "Building with ./gradlew (Gradle 9.3.1)..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Building with gradle CLI (Gradle 9.3.1)..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify Generated APK
        run: |
          ls -la app/build/outputs/apk/debug/
          find app/build/outputs/apk/ -name "*.apk"

      - name: Prepare APK Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/WorkShortCut-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/WorkShortCut-v1.0.${{ github.run_number }}.apk"
          echo "Release assets prepared:"
          ls -la release-assets/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkShortCut-Debug-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Auto Deploy GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Work ShortCut ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: release-assets/*.apk
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 Work ShortCut - Automated Deployment Build

            This release was automatically built, signed, and deployed by GitHub Actions.

            - **Application**: Work ShortCut
            - **Build Number**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Triggered By**: `${{ github.event_name }}` (${{ github.actor }})

            ### 📥 Direct APK Downloads:
            - **`WorkShortCut-latest.apk`**: Always contains the latest build.
            - **`WorkShortCut-v1.0.${{ github.run_number }}.apk`**: Version-tagged build for archiving.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
